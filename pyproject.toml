[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "placetype-ph"
version = "0.1.1"
description = "Hierarchical PSIC/PCPC/PSCC classification for OpenPlaces PH outputs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "James Matthew Miraflor"}]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16",
  "scikit-learn>=1.5",
  "openpyxl>=3.1",
  "requests>=2.32",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
llm = ["openai>=1.50"]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[project.scripts]
placetype = "placetype_ph.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/placetype_ph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
